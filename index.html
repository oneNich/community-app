<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4f46e5">
    <title>Community App</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Auth View -->
        <div id="authView" class="view">
            <div class="auth-card">
                <h1>Community App</h1>
                <form id="authForm">
                    <input id="authEmail" type="email" placeholder="Email" required>
                    <input id="authPassword" type="password" placeholder="Password" required>
                    <button type="submit">Login / Register</button>
                </form>
            </div>
        </div>

        <!-- Main App View -->
        <div id="mainView" class="view hidden">
            <header>
                <h1>Community App</h1>
                <button id="logoutBtn" class="btn-secondary">Logout</button>
            </header>

            <div class="container">
                <!-- Profile Section -->
                <section class="card">
                    <h2>My Profile</h2>
                    <form id="profileForm">
                        <input id="profilePhone" type="tel" placeholder="Phone">
                        <input id="profileEmail" type="email" placeholder="Email" readonly>
                        <button type="submit" class="btn-primary">Save Profile</button>
                    </form>
                </section>

                <!-- Members Section -->
                <section class="card">
                    <h2>Community Members</h2>
                    <div id="membersList" class="list"></div>
                </section>

                <!-- Issues Section -->
                <section class="card">
                    <h2>Create Issue</h2>
                    <form id="issueForm">
                        <input id="issueTitle" type="text" placeholder="Issue title" required>
                        <textarea id="issueDesc" placeholder="Description"></textarea>
                        <button type="submit" class="btn-primary">Create Issue</button>
                    </form>
                </section>

                <section class="card">
                    <h2>All Issues</h2>
                    <div id="issuesList" class="list"></div>
                </section>

                <!-- Tasks Section -->
                <section class="card">
                    <h2>Create Task</h2>
                    <form id="taskForm">
                        <select id="taskIssue" required>
                            <option value="">Select issue</option>
                        </select>
                        <input id="taskTitle" type="text" placeholder="Task title" required>
                        <textarea id="taskDesc" placeholder="Description"></textarea>
                        <select id="taskAssignee">
                            <option value="">Unassigned</option>
                        </select>
                        <button type="submit" class="btn-primary">Create Task</button>
                    </form>
                </section>

                <section class="card">
                    <h2>All Tasks</h2>
                    <div id="tasksList" class="list"></div>
                </section>
            </div>
        </div>
    </div>

    <!-- Task Detail Modal -->
    <div id="taskModal" class="modal hidden">
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            <h2 id="taskModalTitle"></h2>
            <p id="taskModalDesc"></p>
            <div class="modal-section">
                <strong>Assigned to:</strong> <span id="taskModalAssignee">Unassigned</span>
            </div>
            <div class="modal-section">
                <h3>Comments</h3>
                <div id="commentsList" class="list"></div>
                <form id="commentForm">
                    <textarea id="commentText" placeholder="Add a comment..." required></textarea>
                    <button type="submit" class="btn-primary">Post Comment</button>
                </form>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
